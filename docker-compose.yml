version: '3.8'

services:
  firmware:
    build:
      context: .
      dockerfile: docker/firmware/Dockerfile
    networks:
      - satellite-network


  groundstation:
    depends_on:
      - firmware
    build:
      context: .
      dockerfile: docker/groundstation/Dockerfile
    networks:
      - satellite-network
    ports:
      - "5900:5900"
      - "6080:6080"

networks:
  satellite-network:
    driver: bridge

  