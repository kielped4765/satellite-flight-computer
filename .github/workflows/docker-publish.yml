name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push firmware
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/firmware/Dockerfile
          push: true
          tags: kielped4765/satellite-firmware:latest

  build-groundstation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run pytest tests
        run: |
          pip install pytest pyserial matplotlib
          pytest tests/ -v

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push groundstation
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/groundstation/Dockerfile
          push: true
          tags: kielped4765/satellite-groundstation:latest